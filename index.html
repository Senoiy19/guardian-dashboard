<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BOLD Guardian</title>
  <style>
    :root { --bg:#0b0d10; --panel:#11151a; --panel2:#151a20; --text:#f2f4f7; --muted:#8d96a3; --line:#242b34; --good:#55d98b; --warn:#f0c75e; --bad:#ff6b6b; --accent:#b7ff5a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .wrap { max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:30px; letter-spacing:-.03em; }
    .sub { color:var(--muted); margin-top:4px; }
    .status { color:var(--good); font-size:12px; }
    .search { display:flex; gap:10px; margin-bottom:20px; }
    input { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:13px 14px; border-radius:10px; outline:none; }
    button { background:var(--accent); color:#0a0d08; border:0; border-radius:10px; padding:0 18px; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .label { color:var(--muted); font-size:12px; }
    .value { margin-top:6px; font-size:21px; font-weight:700; letter-spacing:-.02em; }
    .section { margin-top:28px; }
    .section h2 { font-size:17px; margin:0 0 12px; }
    .table { overflow:auto; border:1px solid var(--line); border-radius:12px; }
    table { width:100%; border-collapse:collapse; min-width:820px; }
    th,td { text-align:left; padding:12px 13px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; background:var(--panel); }
    tr:last-child td { border-bottom:0; }
    .pill { display:inline-block; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; }
    .healthy,.mildly { color:var(--good); background:rgba(85,217,139,.1); }
    .sickly { color:var(--warn); background:rgba(240,199,94,.1); }
    .risky,.liquidatable { color:var(--bad); background:rgba(255,107,107,.1); }
    a { color:var(--accent); text-decoration:none; }
    .empty,.error { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; color:var(--muted); }
    .error { color:var(--bad); }
    .small { color:var(--muted); font-size:12px; }
    @media (max-width:800px) { .grid { grid-template-columns:repeat(2,1fr); } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>BOLD Guardian</h1><div class="sub">Liquity V2 position intelligence</div></div>
    <div id="status" class="status">● Ready</div>
  </header>

  <form id="form" class="search">
    <input id="wallet" autocomplete="off" placeholder="Ethereum wallet address (0x...)" />
    <button id="load">Inspect</button>
  </form>

  <div id="error"></div>
  <div id="summary" class="grid"></div>

  <section class="section">
    <h2>Troves</h2>
    <div id="troves" class="empty">Enter a wallet address to inspect its Liquity V2 positions.</div>
  </section>

  <section class="section">
    <h2>BOLD yield opportunities</h2>
    <div id="yield" class="empty">Loading...</div>
  </section>
</div>
<script>
window.ethPrice = null;
let lastSummary = null;
const $ = id => document.getElementById(id);
const fmt = (n,d=2) => n == null ? "—" : Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
const money = n => n == null ? "—" : "$"+fmt(n,2);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pill(v){ return `<span class="pill ${v.toLowerCase().replaceAll(' ','')}">${esc(v)}</span>`; }
function renderSummary(s){ lastSummary=s;
  $('summary').innerHTML = [
    ['Health',pill(s.overall_health)],
    ['Troves',fmt(s.trove_count,0)],
    ['Total BOLD debt',fmt(s.total_debt_bold)],
    ['Collateral value',money(s.total_collateral_usd)],
    ['Weighted borrowing rate',(s.weighted_borrowing_rate_pct==null?'—':fmt(s.weighted_borrowing_rate_pct,3)+'%')],
    ['Overall CR',(s.overall_collateral_ratio_pct==null?'—':fmt(s.overall_collateral_ratio_pct)+'%')],
    ['ETH price',window.ethPrice==null?'Loading…':money(window.ethPrice)]
  ].map(([l,v])=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
}
function renderTroves(rows){
 if(!rows.length){ $('troves').innerHTML='<div class="empty">No active or zombie Liquity V2 Troves found for this wallet.</div>'; return; }
 $('troves').innerHTML=`<div class="table"><table><thead><tr><th>Branch</th><th>Health</th><th>Collateral</th><th>Debt</th><th>Rate</th><th>CR</th><th>Liquidation price</th><th>Buffer</th></tr></thead><tbody>${rows.map(p=>`<tr>
 <td>${esc(p.branch)}</td><td>${pill(p.health)}</td><td>${fmt(p.collateral,4)} ${esc(p.branch)}</td><td>${fmt(p.debt_bold)} BOLD</td><td>${fmt(p.annual_interest_rate_pct,3)}%</td><td>${fmt(p.collateral_ratio_pct)}%</td><td>${money(p.liquidation_price_usd)}</td><td>${fmt(p.distance_to_liquidation_pct)}%</td>
 </tr>`).join('')}</tbody></table></div>`;
}
async function loadWallet(addr){
 $('error').innerHTML=''; $('load').disabled=true; $('status').textContent='● Reading Ethereum…';
 try { const r=await fetch('/api/wallet/'+encodeURIComponent(addr)); const j=await r.json(); if(!r.ok) throw new Error(j.detail||'Wallet read failed'); renderSummary(j.summary); renderTroves(j.troves); $('status').textContent='● Live'; }
 catch(e){ $('error').innerHTML=`<div class="error">${esc(e.message)}</div>`; $('status').textContent='● Error'; }
 finally { $('load').disabled=false; }
}
async function loadEth(){ try { const r=await fetch('/api/eth'); const j=await r.json(); if(r.ok){ window.ethPrice=j.price_usd; if(lastSummary) renderSummary(lastSummary); } } catch(e) {} }
async function loadYield(){
 try { const r=await fetch('/api/yield'); const j=await r.json(); if(!r.ok) throw new Error(j.detail||'Yield read failed'); $('yield').innerHTML=`<div class="table"><table><thead><tr><th>Provider</th><th>Venue</th><th>APR</th><th>TVL</th><th>Source</th></tr></thead><tbody>${j.venues.map(v=>`<tr><td>${esc(v.provider)}</td><td>${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noreferrer">${esc(v.venue)}</a>`:esc(v.venue)}</td><td>${fmt(v.apr_pct,2)}%</td><td>${money(v.tvl_usd)}</td><td>${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noreferrer">Open</a>`:'—'}</td></tr>`).join('')}</tbody></table></div><div class="small" style="margin-top:8px">${j.count} venues · Liquity official BOLD venue API</div>`; }
 catch(e){ $('yield').innerHTML=`<div class="error">${esc(e.message)}</div>`; }
}
$('form').addEventListener('submit',e=>{e.preventDefault(); const v=$('wallet').value.trim(); if(v) loadWallet(v);});
loadEth();
loadYield();
</script>
</body>
</html>
